<svg xmlns="http://www.w3.org/2000/svg" width="500" height="220" viewBox="0 0 500 220" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect width="500" height="220" fill="#f4f4f4"/>

  <!-- область-круг: Python -->
  <circle cx="90" cy="110" r="70" fill="#3776ab"/>
  <text x="90" y="118" font-family="Consolas, Menlo, monospace" font-size="22" font-weight="bold"
        text-anchor="middle" fill="#ffd43b">Python</text>

  <!-- область-прямоугольник: JavaScript -->
  <rect x="200" y="40" width="130" height="140" fill="#f0db4f"/>
  <text x="265" y="118" font-family="Consolas, Menlo, monospace" font-size="18" font-weight="bold"
        text-anchor="middle" fill="#323330">JavaScript</text>

  <!-- область-многоугольник (треугольник): C++ -->
  <polygon points="420,30 480,180 360,180" fill="#00599c"/>
  <text x="420" y="150" font-family="Consolas, Menlo, monospace" font-size="20" font-weight="bold"
        text-anchor="middle" fill="#ffffff">C++</text>
</svg>
